[project]
name = "elephant-rag-demo"
version = "0.1.0"
description = "An inspectable PDF-to-chunks, embeddings and retrieval learning project"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pypdf==7.1.0",
  "pymupdf==2.1",
  "pymupdf4llm==2.1",
  "tiktoken==0.14.0",
  "pydantic>=2.8,<3",
  "reportlab==5.1.0",
  "onnxruntime==1.32.0",
  "huggingface-hub==2.4.0",
  "tokenizers==0.23.3",
  "numpy==2.5.4",
]

[project.scripts]
elephant-rag = "elephant_rag.walkthrough:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elephant_rag"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
browser = ["playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
